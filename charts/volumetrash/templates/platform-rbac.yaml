{{- /* The platform ConfigMap is read with the API reader, so the operator needs get on it in its namespace. */ -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "volumetrash.fullname" . }}-platform
  namespace: {{ .Values.platform.namespace }}
  labels:
    {{- include "volumetrash.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - {{ .Values.platform.configMap }}
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "volumetrash.fullname" . }}-platform
  namespace: {{ .Values.platform.namespace }}
  labels:
    {{- include "volumetrash.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "volumetrash.fullname" . }}-platform
subjects:
  - kind: ServiceAccount
    name: {{ include "volumetrash.fullname" . }}
    namespace: {{ .Release.Namespace }}
